name: Scheduled data refresh

# The production orchestrator for the public site. Pulls fresh EIA and weather
# data, rebuilds the warehouse, validates it, retrains, and commits the updated
# app artifact so the deployed Space serves current data.
#
# Requires the repository secret: EIA_API_KEY

on:
  schedule:
    # 07:00 UTC on Mondays. EIA publishes on a lag, so this captures a settled week.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Ignore watermarks and re-download the entire history"
        type: boolean
        default: false
      retrain:
        description: "Retrain the models as well as refreshing data"
        type: boolean
        default: true

permissions:
  contents: write
  # Needed to dispatch the Space sync at the end of the job. See that step for
  # why the sync cannot simply trigger itself.
  actions: write

jobs:
  refresh:
    name: Refresh warehouse and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install statsmodels
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps

      - name: Verify API credentials
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: gridpulse probe

      - name: Extract
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: gridpulse ingest ${{ inputs.full_refresh && '--full-refresh' || '' }}

      - name: Build warehouse
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: gridpulse build --rebuild

      - name: Validate
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: gridpulse quality
        continue-on-error: true

      - name: Train models
        if: ${{ inputs.retrain != false }}
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: gridpulse train

      - name: Detect anomalies
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: gridpulse anomalies

      - name: Export app artifact
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: gridpulse export

      # Retraining changes every metric the README quotes. Without this the
      # published table silently drifts away from artifacts/leaderboard.json,
      # and a README claiming accuracy the models no longer achieve is worse
      # than no README at all. The script fails loudly if the leaderboard or
      # the RESULTS markers are missing.
      - name: Regenerate the README results table
        run: python scripts/update_readme.py

      - name: Commit refreshed artifacts
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/gold/gridpulse_app.duckdb artifacts/ README.md
          if git diff --staged --quiet; then
            echo "Nothing changed."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: automated data refresh $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub deliberately does not start a workflow from a push made with the
      # default GITHUB_TOKEN, which is what prevents a workflow from triggering
      # itself forever. The consequence here is that the commit above redeploys
      # Streamlit, which reads GitHub directly, but never fires the Hugging Face
      # sync. The two public deployments would then drift apart a little more
      # every week, with no error anywhere to say so.
      #
      # workflow_dispatch is the documented exception to that rule: it does
      # start a run even when dispatched with GITHUB_TOKEN. So the sync is
      # requested explicitly rather than left to a push event that will not
      # arrive. The dispatched run checks out main after this commit landed, so
      # it mirrors the refreshed artifacts rather than the previous ones.
      - name: Mirror the refreshed repository to the Space
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-huggingface.yml --ref main

      - name: Job summary
        if: always()
        run: |
          echo "### GridPulse refresh" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/headline.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat artifacts/headline.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
