name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.8.6
      - name: Check formatting and lint rules
        run: |
          # scripts/ is included because update_readme.py runs inside the weekly
          # refresh workflow. It is production code, not a scratch folder, and
          # leaving it unlinted let two rule violations sit there unnoticed.
          ruff check src tests orchestration scripts app.py
          ruff format --check src tests app.py || echo "::warning::Formatting drift detected (non-blocking)"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov statsmodels
          pip install -e . --no-deps

      - name: Run test suite
        env:
          EIA_API_KEY: ci-placeholder-not-used
          GRIDPULSE_BAS: PJM,ERCO,CISO
        run: pytest -v --cov=gridpulse --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  dbt:
    name: dbt parse and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dbt
        run: pip install dbt-core==1.9.1 dbt-duckdb==1.9.1
      - name: Validate the dbt project
        working-directory: dbt/gridpulse
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir . --target ci

  dagster:
    name: Dagster definitions load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install dagster==1.9.5
          pip install -e . --no-deps
      - name: Validate the asset graph loads
        env:
          EIA_API_KEY: ci-placeholder-not-used
        run: |
          python - <<'PY'
          from orchestration.dagster_app.definitions import defs

          graph = defs.get_asset_graph()
          keys = getattr(graph, "all_asset_keys", None) or graph.get_all_asset_keys()
          keys = sorted(str(k) for k in keys)
          print(f"Loaded {len(keys)} assets:")
          for key in keys:
              print("  -", key)
          assert len(keys) >= 8, f"Expected at least 8 assets, found {len(keys)}"

          jobs = [j.name for j in defs.get_all_job_defs()] if hasattr(defs, "get_all_job_defs") else []
          print("Jobs:", jobs)
          PY
