# dbt connects to the same DuckDB file the Python pipeline builds.
# Run dbt from this directory:  dbt build --profiles-dir .
gridpulse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "../../data/gold/gridpulse.duckdb"
      threads: 4
      extensions: [icu]
    ci:
      type: duckdb
      path: ":memory:"
      threads: 2
